# This is a basic workflow to help you get started with Actions

name: CI Unittests

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - release*
  schedule:
    # Nightly run unit tests to check for implicit dependency issues between pull requests.
    - cron: '0 0 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

defaults:
  run:
    shell: bash

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# NOTE: GitHub actions does not support anchors, apparently. Forgive duplication of job
#       steps.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # Cache local python environment artifacts for the current python version
      # and poetry lockfile hash.
      - uses: actions/cache@v4
        id: env-cache
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs/
          key: host-ubuntu-24.04-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}-
      - name: Setup Environment
        uses: ./.github/actions/python-poetry-setup
      - name: Lint with Flake8
        run: poetry run flake8

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # Cache local python environment artifacts for the current python version
      # and poetry lockfile hash.
      - uses: actions/cache@v4
        id: env-cache
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs/
          key: host-ubuntu-24.04-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}-
          restore-keys: |
            host-ubuntu-24.04-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-
      - name: Setup Environment
        uses: ./.github/actions/python-poetry-setup
      - name: Typecheck with MyPy
        run: poetry run mypy

  pytest:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Extras for included, optional plugin support (space-separated lists)
        opt-extra: [
            "",  # no extras
        ]
      # We want all python versions tested even if one of them happens to fail
      fail-fast: false


    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      # Cache local python environment artifacts for the current python version
      # and poetry lockfile hash.
      # Caching occurs on a successfully completing job (e.g. after running
      # pytest in this job's case).
      - uses: actions/cache@v4
        id: env-cache
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs/
          key: host-ubuntu-24.04-${{ runner.arch }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}-${{ matrix.opt-extra }}

      - name: Setup Environment
        uses: ./.github/actions/python-poetry-setup

      - name: Optionally install additional requirements
        env:
          OPT_EXTRA: ${{ matrix.opt-extra }}
        run: |
          if [[ -n "$OPT_EXTRA" ]]
          then
            poetry install --extras "$OPT_EXTRA"
          fi

      - name: Run Unittests
        run: poetry run pytest

      - name: Codecov report submission
        if: github.event_name != 'schedule'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN || '' }}
          fail_ci_if_error: true
          files: coverage.xml
          flags: unittests
